<style>
:root{
 --bg:#05101b;--bg2:#081827;--surface:#0b1a2a;--surface2:#10253a;--surface3:#132c42;
 --text:#edf6ff;--muted:#8fa7bb;--dim:#5e768c;--line:rgba(255,255,255,.09);
 --green:#00d5a0;--blue:#55a6ff;--cyan:#26dbe8;--yellow:#ffc44f;--orange:#ff8239;
 --red:#ff5063;--purple:#9a7dff;--shadow:0 18px 55px rgba(0,0,0,.30)
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
 font-family:Inter,Arial,sans-serif;color:var(--text);background:
 radial-gradient(circle at 80% -10%,rgba(0,213,160,.13),transparent 30%),
 radial-gradient(circle at -5% 50%,rgba(85,166,255,.08),transparent 30%),
 linear-gradient(135deg,#04101b,#071522 70%,#06111c);
 min-height:100vh;overflow-x:hidden
}
body.rain-bg{background:linear-gradient(rgba(3,13,24,.78),rgba(3,13,24,.88)),radial-gradient(circle at 80% 0%,#205575,transparent 42%),#06111d}
body.storm-bg{background:linear-gradient(rgba(3,8,16,.84),rgba(3,8,16,.94)),radial-gradient(circle at 80% 0%,#4d485f,transparent 42%),#040b14}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#1c344b;border-radius:20px}
::selection{background:rgba(0,213,160,.22)}

.sidebar{
 position:fixed;left:0;top:0;width:280px;height:100vh;z-index:2000;
 display:flex;flex-direction:column;background:linear-gradient(180deg,#071a2a,#05111d 80%);
 border-right:1px solid var(--line)
}
.brand{padding:22px 18px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;gap:12px;align-items:center}
.brand-icon{
 width:49px;height:49px;border-radius:14px;display:grid;place-items:center;color:#002016;
 background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 12px 35px rgba(0,213,160,.18)
}
.brand h2{font-size:14px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:8px;color:var(--muted);margin-top:4px;letter-spacing:1.25px}
.nav{padding:13px 10px;overflow:auto;flex:1}
.nav-label{font-size:9px;letter-spacing:1.6px;color:#5b7185;margin:16px 12px 8px}
.nav a{
 display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:9px;
 color:#9cb2c5;font-size:10px;margin-bottom:3px;transition:.18s
}
.nav a:hover,.nav a.active{background:rgba(0,213,160,.08);color:var(--green)}
.nav a.active{border-left:3px solid var(--green)}
.nav i{width:18px;text-align:center}
.system{padding:15px;border-top:1px solid var(--line)}
.status-box{padding:12px;border-radius:10px;background:rgba(0,213,160,.05);border:1px solid rgba(0,213,160,.15);font-size:8px;color:#b7c9d8}
.pulse-dot{
 display:inline-block;width:7px;height:7px;border-radius:50%;background:#1ddd91;box-shadow:0 0 0 0 rgba(29,221,145,.5);
 animation:pulse 1.7s infinite;margin-right:6px
}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(29,221,145,0)}100%{box-shadow:0 0 0 0 rgba(29,221,145,0)}}

.main{margin-left:280px;min-height:100vh}
.header{
 height:78px;position:sticky;top:0;z-index:1500;padding:0 28px;
 display:flex;align-items:center;justify-content:space-between;
 background:rgba(5,16,27,.84);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)
}
.header h1{font-size:19px}.header p{font-size:9px;color:var(--muted);margin-top:5px}
.header-actions{display:flex;gap:8px;align-items:center}
.live-pill,.tag{
 display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:20px;
 background:rgba(0,213,160,.06);border:1px solid rgba(0,213,160,.17);color:var(--green);font-size:8px
}
.icon-btn,.btn,.map-btn,.select{
 border:1px solid var(--line);background:#0c2134;color:#b8cad8;border-radius:9px
}
.icon-btn{width:37px;height:37px}.icon-btn:hover,.btn:hover,.map-btn:hover{border-color:var(--green);color:#fff}
.content{padding:28px;max-width:2000px;margin:auto}

.hero{
 position:relative;overflow:hidden;padding:40px;min-height:345px;border-radius:22px;margin-bottom:25px;
 background:
 linear-gradient(120deg,rgba(7,45,60,.98),rgba(11,30,48,.97) 58%,rgba(8,21,35,.97));
 border:1px solid rgba(0,213,160,.18);box-shadow:var(--shadow)
}
.hero::before{content:"";position:absolute;right:-220px;top:-360px;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,rgba(0,213,160,.24),transparent 68%)}
.hero::after{content:"";position:absolute;right:9%;bottom:-330px;width:470px;height:470px;border-radius:50%;background:radial-gradient(circle,rgba(85,166,255,.16),transparent 68%)}
.hero-grid{
 position:absolute;inset:0;opacity:.08;background-image:
 linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);
 background-size:35px 35px;mask-image:linear-gradient(90deg,transparent 0%,black 58%,transparent 100%)
}
.hero-inner{position:relative;z-index:2;max-width:1100px}
.badge{
 display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(0,213,160,.18);
 background:rgba(0,213,160,.07);color:var(--green);font-size:8px;border-radius:20px
}
.hero h2{font-size:40px;line-height:1.14;margin:18px 0 13px}
.hero p{font-size:12px;line-height:1.8;color:#aac0d0;max-width:1000px}
.hero-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{padding:10px 14px;font-size:9px;font-weight:700}
.btn-primary{background:var(--green);border-color:var(--green);color:#002219}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}

.section{margin-bottom:30px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:14px}
.section-head h2{font-size:16px}.section-head p{font-size:9px;color:var(--muted);margin-top:5px}

.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{
 padding:16px;border-radius:14px;background:rgba(11,27,44,.9);border:1px solid var(--line);
 box-shadow:var(--shadow);transition:.2s
}
.kpi:hover{transform:translateY(-3px);background:rgba(16,37,58,.96)}
.kpi-top{display:flex;justify-content:space-between;align-items:center}
.kpi-label{font-size:7px;color:#71879b;letter-spacing:.5px}
.kpi-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.i-green{color:var(--green);background:rgba(0,213,160,.1)}
.i-blue{color:#70b7ff;background:rgba(85,166,255,.1)}
.i-red{color:#ff7e8b;background:rgba(255,80,99,.1)}
.i-yellow{color:#ffd56c;background:rgba(255,196,79,.1)}
.i-purple{color:#c4b5ff;background:rgba(154,125,255,.1)}
.i-cyan{color:#72edf5;background:rgba(38,219,232,.1)}
.kpi h3{font-size:24px;margin-top:13px}.kpi small{font-size:7px;color:var(--muted)}
.kpi .delta{font-size:7px;color:#34e1a8;margin-top:8px}

.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.feature{
 background:rgba(11,27,44,.88);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)
}
.card-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-head h3{font-size:12px}.card-head span{font-size:7px;color:var(--muted)}
.card-body{padding:18px}

.map-search{display:flex;gap:7px;margin-bottom:9px}.map-search input{
 flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#071624;color:#fff;outline:none;font-size:8px
}
.map-search button{padding:9px 12px;border-radius:8px;border:0;background:var(--blue);color:#fff;font-size:8px;font-weight:700}
.map-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.map-btn{padding:7px 10px;font-size:7px}
.map-btn.active{background:rgba(0,213,160,.08);color:var(--green);border-color:rgba(0,213,160,.3)}
.map{height:550px;border-radius:10px;overflow:hidden}
.map-note{font-size:7px;color:#b4c6d5;margin-top:8px}.map-note b{color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px}.legend span{font-size:7px;color:#a9bdcd}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.risk-flex{display:flex;align-items:center;gap:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.risk-circle{
 width:165px;height:165px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative;
 background:conic-gradient(var(--red) 0deg 250deg,#24394e 250deg 360deg)
}
.risk-circle::before{content:"";position:absolute;width:127px;height:127px;border-radius:50%;background:#0b1b2c}
.risk-number{position:relative;z-index:2;text-align:center}.risk-number strong{font-size:39px;display:block}.risk-number small{font-size:7px;color:var(--muted)}
.risk-info h3{font-size:18px}.risk-badge{display:inline-block;margin-top:7px;padding:5px 7px;border-radius:5px;font-size:7px;color:#ff9da8;background:rgba(255,80,99,.1);border:1px solid rgba(255,80,99,.2)}
.risk-info p{font-size:8px;line-height:1.65;color:var(--muted);margin-top:10px}
.factor{margin-top:14px}.factor-head{display:flex;justify-content:space-between;font-size:8px;margin-bottom:6px}.progress{height:7px;background:#182d40;border-radius:10px;overflow:hidden}.progress i{height:100%;display:block;border-radius:10px;transition:width .45s}
.bar-rain{background:linear-gradient(90deg,#2b79ff,#6ebaff)}.bar-soil{background:linear-gradient(90deg,#9b551b,#ffc24b)}
.bar-move{background:linear-gradient(90deg,#00a1bb,#67e7f3)}.bar-seis{background:linear-gradient(90deg,#b6222e,#ff8491)}

.chart-box{height:310px;position:relative}
.weather-card{overflow:hidden;position:relative}
.weather-card.rain::after{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
 background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(150,210,255,.35) 19px 20px,transparent 21px 40px);
 animation:rain 0.85s linear infinite
}
@keyframes rain{to{background-position:80px 110px}}
.weather-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.temp{font-size:53px;font-weight:800}.condition{font-size:9px;color:var(--muted);margin-top:4px}.coords{font-size:7px;color:#6f8699;margin-top:7px}.weather-icon{font-size:64px;color:#7abfff}
.weather-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px;position:relative;z-index:2}.weather-item{
 text-align:center;padding:12px;background:rgba(5,17,29,.54);border:1px solid var(--line);border-radius:9px
}.weather-item i{color:#6fb7ff;margin-bottom:8px}.weather-item strong{display:block;font-size:13px}.weather-item span{font-size:7px;color:var(--muted)}
.source{font-size:7px;color:#6c8296;margin-top:14px;position:relative;z-index:2}
.select{padding:7px 9px;font-size:8px;color:#b9cad8;outline:none}

.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:8px}.data-table th{padding:11px;color:#70889c;text-align:left;border-bottom:1px solid var(--line)}.data-table td{padding:12px 10px;color:#c4d0db;border-bottom:1px solid rgba(255,255,255,.035)}.data-table .state{color:#fff;font-weight:700}
.pill{display:inline-block;padding:4px 7px;border-radius:5px;font-size:6px}.pill-moderate{color:#ffd170;background:rgba(255,196,79,.1)}.pill-low{color:#39e2aa;background:rgba(0,213,160,.1)}.pill-mod{color:#ffd170;background:rgba(255,196,79,.1)}.pill-high{color:#ff8d98;background:rgba(255,80,99,.1)}.pill-critical{color:#fff;background:#941f2a}

.sensor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sensor{
 padding:14px;background:#091a29;border:1px solid var(--line);border-radius:10px;transition:.18s
}.sensor:hover{transform:translateY(-2px);background:#0d2134}.sensor-top{display:flex;justify-content:space-between}.sensor-name{font-size:8px;font-weight:700}.sensor-value{font-size:20px;font-weight:800;margin-top:10px}.sensor-unit{font-size:7px;color:var(--muted)}.sensor-meta{display:flex;justify-content:space-between;font-size:6px;color:#60798e;margin-top:10px}.sensor-status{color:#37e0a5}

.alert-list{display:flex;flex-direction:column;gap:9px}.alert{display:flex;gap:10px;padding:11px;border-radius:8px;border-left:3px solid}.alert-red{background:rgba(255,80,99,.06);border-color:var(--red)}.alert-yellow{background:rgba(255,196,79,.06);border-color:var(--yellow)}.alert-blue{background:rgba(85,166,255,.06);border-color:var(--blue)}.alert-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:7px}.alert h4{font-size:8px}.alert p{font-size:7px;line-height:1.5;color:var(--muted);margin-top:4px}.alert time{font-size:6px;color:#60768a;display:block;margin-top:5px}

.feature{padding:17px}.feature-icon{font-size:21px;color:var(--green)}.feature h4{font-size:9px;margin-top:10px}.feature p{font-size:8px;line-height:1.6;color:var(--muted);margin-top:5px}.feature .metric{margin-top:11px;font-size:7px;color:var(--green)}
.timeline{position:relative;padding-left:20px}.timeline::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#2a435a}.timeline-item{position:relative;margin-bottom:18px}.timeline-item::before{content:"";position:absolute;left:-19px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(0,213,160,.5)}.timeline-item h4{font-size:8px}.timeline-item p{font-size:7px;color:var(--muted);line-height:1.5;margin-top:4px}.timeline-item span{font-size:6px;color:#5e7489}
.pipeline{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:center}.step{padding:14px 7px;text-align:center;background:#091a29;border:1px solid var(--line);border-radius:9px}.step i{font-size:20px;color:var(--green)}.step h4{font-size:7px;margin-top:7px}.step p{font-size:6px;line-height:1.4;color:var(--muted);margin-top:4px}.arrow{font-size:16px;text-align:center;color:#496378}

.scenario{padding:18px;background:linear-gradient(135deg,rgba(0,213,160,.06),rgba(85,166,255,.04));border:1px solid var(--line);border-radius:12px}
.range-row{display:flex;justify-content:space-between;align-items:center;font-size:8px;margin:12px 0 5px}.range{width:100%}
input[type=range]{width:100%;accent-color:var(--green)}
.scenario-result{font-size:26px;font-weight:800;margin-top:8px}

.api-monitor{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.api-stat{padding:11px;border-radius:8px;background:#091a29;border:1px solid var(--line)}.api-stat span{font-size:6px;color:var(--muted)}.api-stat strong{display:block;font-size:13px;margin-top:5px}

.chat-toggle{
 position:fixed;right:24px;bottom:23px;z-index:6000;width:59px;height:59px;border-radius:50%;border:0;
 background:linear-gradient(135deg,var(--green),var(--blue));color:#002218;font-size:21px;box-shadow:0 15px 45px rgba(0,0,0,.38)
}
.chat-panel{
 position:fixed;right:24px;bottom:92px;z-index:5999;width:390px;height:550px;max-width:calc(100vw - 30px);
 display:none;flex-direction:column;overflow:hidden;background:#091a2a;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)
}
.chat-panel.show{display:flex}.chat-head{padding:14px;background:linear-gradient(135deg,#0d2d3b,#10253a);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.chat-head h3{font-size:10px}.chat-head p{font-size:6px;color:#9db2c5;margin-top:4px}.chat-close{border:0;background:none;color:#a1b5c6;font-size:17px}
.chat-messages{flex:1;padding:13px;overflow:auto;display:flex;flex-direction:column;gap:9px}.chat-msg{max-width:88%;padding:9px 10px;border-radius:10px;font-size:8px;line-height:1.55}.chat-msg.bot{align-self:flex-start;background:#12273a;color:#ccdae4}.chat-msg.user{align-self:flex-end;background:rgba(0,213,160,.11);border:1px solid rgba(0,213,160,.16)}
.quick-row{display:flex;gap:6px;padding:0 12px 9px;overflow:auto}.quick-row button{padding:7px 8px;white-space:nowrap;border:1px solid var(--line);background:#0d2235;color:#a8bccb;border-radius:8px;font-size:6px}
.chat-form{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.chat-form input{flex:1;background:#071624;border:1px solid var(--line);border-radius:8px;color:#fff;padding:10px;outline:none;font-size:7px}.chat-form button{width:38px;border:0;border-radius:8px;background:var(--green);color:#002219}

.modal-bg{position:fixed;inset:0;z-index:7000;background:rgba(0,0,0,.7);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:18px}.modal-bg.show{display:flex}.modal{width:100%;max-width:720px;background:#0a1b2b;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}.modal-head{display:flex;justify-content:space-between;padding:15px;border-bottom:1px solid var(--line)}.modal-head h3{font-size:12px}.modal-body{padding:18px;color:#a9bdcd;font-size:8px;line-height:1.8}.close{border:0;background:none;color:#a1b4c5;font-size:18px}

.toast{position:fixed;right:25px;bottom:25px;z-index:8000;background:#10283c;border:1px solid rgba(0,213,160,.22);padding:11px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:8px;transform:translateY(85px);opacity:0;transition:.25s}.toast.show{transform:translateY(0);opacity:1}.toast i{color:var(--green);margin-right:6px}
.footer{border-top:1px solid var(--line);padding:23px 28px;color:#60778d;font-size:7px;display:flex;justify-content:space-between}

@media(max-width:1500px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1150px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){
 .sidebar{width:64px}.brand h2,.brand p,.nav span,.nav-label,.system{display:none}.brand{padding:14px 9px}.brand-row{justify-content:center}.nav a{justify-content:center}
 .main{margin-left:64px}.content{padding:15px}.header{padding:0 14px}.header p{display:none}.hero{padding:28px}.hero h2{font-size:27px}.kpi-grid{grid-template-columns:repeat(2,1fr)}
 .grid3,.grid4{grid-template-columns:1fr}.sensor-grid{grid-template-columns:repeat(2,1fr)}.weather-grid{grid-template-columns:repeat(2,1fr)}.risk-flex{align-items:flex-start}
}
@media(max-width:520px){
 .kpi-grid{grid-template-columns:1fr}.sensor-grid{grid-template-columns:1fr}.risk-flex{flex-direction:column}.pipeline{grid-template-columns:repeat(2,1fr)}
 .chat-panel{right:12px;bottom:83px}.chat-toggle{right:15px;bottom:15px}.live-pill{display:none}.hero h2{font-size:23px}
}

/* ===================== NER-LANDSLIDE AI V2 EXPANSION ===================== */
:root{--glass:rgba(9,25,40,.78);--glass2:rgba(14,36,57,.76);--glow:0 0 34px rgba(38,219,232,.08)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.19;background-image:linear-gradient(rgba(38,219,232,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(38,219,232,.06) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(circle at 70% 15%,black,transparent 72%)}
body::after{content:"";position:fixed;width:38vw;height:38vw;right:-12vw;top:-12vw;border-radius:50%;border:1px solid rgba(38,219,232,.07);box-shadow:0 0 0 70px rgba(38,219,232,.018),0 0 0 140px rgba(38,219,232,.012),0 0 0 210px rgba(38,219,232,.008);pointer-events:none;z-index:-1}
.nav-divider{height:1px;background:var(--line);margin:13px 10px}
.header-actions .mode-btn{height:37px;padding:0 11px;border-radius:9px;border:1px solid rgba(0,213,160,.2);background:rgba(0,213,160,.06);color:var(--green);font-size:8px;font-weight:700}
